<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gomes Sistema Jurídico | Acesso</title>
  <style>
    :root {
      --navy: #101d3b;
      --navy-2: #172b55;
      --blue: #273884;
      --gold: #c3a36a;
      --paper: #fbfcfe;
      --ink: #17243d;
      --muted: #6c778a;
      --line: #dce2eb;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 10%, rgba(54, 78, 131, .28), transparent 35%),
        radial-gradient(ellipse at 88% 90%, rgba(42, 65, 117, .25), transparent 32%),
        linear-gradient(135deg, #0d1730 0%, #14254a 55%, #0c1831 100%);
      overflow-x: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 440px;
      height: 440px;
      border: 1px solid rgba(216, 225, 244, .07);
      transform: rotate(42deg);
      pointer-events: none;
    }
    body::before { top: -290px; left: -250px; }
    body::after { bottom: -330px; right: -280px; }
    .login-card {
      position: relative;
      width: min(100%, 410px);
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 20px;
      padding: 34px 36px 28px;
      box-shadow: 0 24px 70px rgba(2, 8, 23, .28);
    }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      margin: 0 auto 27px;
    }
    .brand-symbol {
      width: 51px;
      height: 54px;
      object-fit: contain;
    }
    .brand-divider {
      width: 1px;
      height: 43px;
      background: #cbd3df;
    }
    .brand-wordmark { display: flex; flex-direction: column; gap: 3px; }
    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      letter-spacing: 2.1px;
      line-height: 1;
      color: #172747;
    }
    .brand-subtitle {
      font-size: 10px;
      letter-spacing: 2.15px;
      color: #273884;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .gold-rule { width: 34px; height: 2px; background: var(--gold); margin: 0 auto 24px; }
    .heading { text-align: center; margin-bottom: 25px; }
    .heading h1 { font-size: 21px; font-weight: 650; margin: 0 0 7px; letter-spacing: -.35px; }
    .heading p { font-size: 13px; color: var(--muted); margin: 0; }
    .field { margin-bottom: 17px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #35435c; margin-bottom: 7px; }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%; height: 45px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      padding: 0 13px;
      font: inherit; font-size: 13px;
      color: var(--ink);
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .input-wrap input:focus { border-color: #6b80bd; box-shadow: 0 0 0 3px rgba(39,56,132,.09); }
    .input-wrap input::placeholder { color: #a0a9b8; }
    .password-input { padding-right: 47px !important; }
    .toggle-password {
      position: absolute; top: 0; right: 0; height: 45px; width: 44px;
      border: 0; background: transparent; color: #758198; cursor: pointer;
      display: grid; place-items: center;
    }
    .toggle-password svg { width: 18px; height: 18px; }
    .options { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 2px 0 22px; font-size: 12px; }
    .remember { display: flex; align-items: center; gap: 7px; color: #5e6b80; cursor: pointer; }
    .remember input { accent-color: var(--blue); width: 14px; height: 14px; margin: 0; }
    .forgot { color: var(--blue); text-decoration: none; font-weight: 600; }
    .forgot:hover { text-decoration: underline; }
    .submit-btn {
      width: 100%; height: 46px; border: 0; border-radius: 9px;
      background: linear-gradient(135deg, #263b78, #14264c);
      color: #fff; font: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: transform .15s, filter .15s;
    }
    .submit-btn:hover { filter: brightness(1.08); }
    .submit-btn:active { transform: translateY(1px); }
    .footer { text-align: center; color: #9aa4b5; font-size: 10px; margin-top: 23px; letter-spacing: .25px; }
    .footer .lock { display: inline-block; vertical-align: -2px; margin-right: 5px; color: var(--gold); }
    .notice { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; background: #eef2fb; color: #33466f; }
    .notice.show { display: block; }
    @media (max-width: 460px) {
      body { padding: 18px 14px; }
      .login-card { padding: 29px 23px 24px; border-radius: 17px; }
      .brand { margin-bottom: 24px; }
      .brand-symbol { width: 44px; height: 47px; }
      .brand-name { font-size: 25px; }
      .brand-subtitle { font-size: 9px; letter-spacing: 1.7px; }
      .heading h1 { font-size: 19px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="login-card" aria-label="Acesso ao Gomes Sistema Jurídico">
    <div class="brand" aria-label="Gomes Sistema Jurídico">
      <img class="brand-symbol" src="logo.png" alt="Símbolo Gomes" />
      <span class="brand-divider" aria-hidden="true"></span>
      <div class="brand-wordmark">
        <span class="brand-name">GOMES</span>
        <span class="brand-subtitle">Sistema Jurídico</span>
      </div>
    </div>
    <div class="gold-rule" aria-hidden="true"></div>
    <div class="heading">
      <h1>Acesso ao sistema</h1>
      <p>Entre com suas credenciais para continuar.</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail profissional</label>
        <div class="input-wrap">
          <input id="email" name="email" type="email" placeholder="nome@escritorio.com.br" autocomplete="username" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input class="password-input" id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
          <button class="toggle-password" id="togglePassword" type="button" aria-label="Mostrar senha" title="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="options">
        <label class="remember"><input type="checkbox" id="remember" /> Manter conectado</label>
        <a class="forgot" href="#" id="forgotPassword">Esqueceu a senha?</a>
      </div>
      <button class="submit-btn" type="submit">Entrar</button>
      <div class="notice" id="notice" role="status"></div>
    </form>
    <div class="footer"><span class="lock">◆</span> Ambiente de acesso restrito</div>
  </main>
  <script>
    const passwordField = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const notice = document.getElementById('notice');

    togglePassword.addEventListener('click', () => {
      const showing = passwordField.type === 'text';
      passwordField.type = showing ? 'password' : 'text';
      togglePassword.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
      togglePassword.title = showing ? 'Mostrar senha' : 'Ocultar senha';
    });

    document.getElementById('forgotPassword').addEventListener('click', (event) => {
      event.preventDefault();
      notice.textContent = 'A recuperação de senha será disponibilizada quando o sistema de autenticação estiver conectado.';
      notice.classList.add('show');
    });

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      notice.textContent = 'Interface demonstrativa: o login ainda não está conectado à autenticação do servidor.';
      notice.classList.add('show');
    });
  </script>
</body>
</html>
