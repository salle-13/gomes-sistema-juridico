<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gomes · Sistema Jurídico</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div id="login" hidden></div>
<div class="band"><span class="firm">Gomes<small>Assessoria Jurídica</small></span><span>Araguari/MG</span></div>
<div class="shell">
  <nav class="side-nav" id="nav" aria-label="Módulos"></nav>
  <div class="content">
    <header class="top">
      <img class="logo" src="logo.png" alt="Gomes Assessoria Jurídica" width="56" height="61">
      <div class="brand">
        <h1>Sistema Jurídico</h1>
        <span id="modeline">Carregando…</span>
      </div>
      <div class="gsearch" id="gsearch" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscaQ" type="search" autocomplete="off" placeholder="Buscar pasta, processo ou pessoa…" aria-label="Buscar pasta, número de processo ou pessoa" role="combobox" aria-controls="buscaRes" aria-expanded="false" aria-autocomplete="list" data-oninput="busca-digitar" data-onkeydown="busca-tecla" data-onfocus="busca-foco">
        <kbd>/</kbd>
        <div class="gsearch-res" id="buscaRes" role="listbox" hidden></div>
      </div>
      <div id="notif"></div>
      <div class="me-chip" id="mechip"></div>
      <button class="btn primary" data-action="novo-prazo">+ Novo prazo</button>
    </header>
    <section class="alerts" id="alerts" aria-live="polite"></section>
    <div id="notice"></div>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="js/prazo-logic.js"></script>
<script src="js/schema.js"></script>
<script src="js/seed.js"></script>
<script src="js/core.js"></script>
<script src="js/export.js"></script>
<script src="js/m-agenda.js"></script>
<script src="js/m-processos.js"></script>
<script src="js/m-publicacoes.js"></script>
<script src="js/m-clientes.js"></script>
<script src="js/m-importacao.js"></script>
<script src="js/m-documentos.js"></script>
<script src="js/m-modelos.js"></script>
<script src="js/m-equipe.js"></script>
<script src="js/m-financeiro.js"></script>
<script src="js/m-fin-painel.js"></script>
<script src="js/m-relatorios.js"></script>
<script src="js/m-notificacoes.js"></script>
<script src="js/m-busca.js"></script>
<script src="js/m-inicio.js"></script>
<script src="js/m-inicio-widgets.js"></script>
<script src="js/login.js"></script>
<script src="js/app.js"></script>
</body>
</html>
