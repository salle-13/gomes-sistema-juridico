<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso · Gomes Sistema Jurídico</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-1: #0B1A3D;
    --navy-2: #13275C;
    --accent: #273884;
    --accent-dark: #1A2A66;
    --ink: #13120B;
    --muted: #54595F;
    --line: #D6D8DE;
    --card: #F7F8FA;
    --danger: #B8322A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 80% 85%, #1E3A7A 0%, transparent 45%),
                radial-gradient(ellipse at 10% 10%, #182F6B 0%, transparent 40%),
                linear-gradient(160deg, var(--navy-2) 0%, var(--navy-1) 60%, #0A1633 100%);
    display: grid; place-items: center;
    padding: 24px; overflow: hidden; position: relative;
  }
  .curvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: var(--card);
    border-radius: 18px;
    padding: 40px 36px 36px;
    box-shadow: 0 30px 70px rgba(3, 10, 30, .55), 0 2px 6px rgba(3, 10, 30, .25);
  }
  .logo { display: block; margin: 0 auto 22px; height: 96px; width: auto; }
  h1 { margin: 0; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -.01em; color: var(--navy-1); }
  .sub { margin: 6px 0 26px; text-align: center; color: var(--muted); font-size: 15px; }

  .campo { position: relative; margin-bottom: 14px; }
  .campo svg.ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #3B4150; pointer-events: none; }
  .campo input {
    width: 100%; height: 50px;
    padding: 0 48px 0 50px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: #FBFBFC;
    border: 1.5px solid var(--line); border-radius: 9px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .campo input::placeholder { color: #4A505C; }
  .campo input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(39, 56, 132, .15); background: #fff; }
  .olho {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; background: none; border-radius: 6px;
    color: #3B4150; cursor: pointer; display: grid; place-items: center;
  }
  .olho:hover { background: rgba(39, 56, 132, .08); }
  .olho:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 24px; font-size: 14.5px; }
  .check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .check input { width: 19px; height: 19px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .link { color: var(--accent-dark); text-decoration: none; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  .link:hover { text-decoration: underline; }

  .entrar {
    width: 100%; height: 52px; border: 0; border-radius: 9px;
    font: inherit; font-size: 17px; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, #1A3170 0%, var(--navy-1) 100%);
    cursor: pointer; transition: filter .15s, transform .05s;
  }
  .entrar:hover { filter: brightness(1.15); }
  .entrar:active { transform: translateY(1px); }
  .entrar:focus-visible { outline: 3px solid rgba(39, 56, 132, .45); outline-offset: 2px; }
  .entrar[disabled] { opacity: .7; cursor: wait; }

  .msg { min-height: 20px; margin: 12px 0 0; text-align: center; font-size: 14px; color: var(--danger); }
  .msg.info { color: var(--muted); }

  @media (max-width: 480px) {
    .card { padding: 32px 22px 26px; border-radius: 16px; }
    .logo { height: 80px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<svg class="curvas" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#8FA8E0" stroke-opacity=".18" stroke-width="1.2">
    <path d="M0 430 C 180 300, 260 160, 320 0"/>
    <path d="M0 300 C 140 200, 230 90, 270 0"/>
    <path d="M1130 1024 C 1250 860, 1380 720, 1536 600"/>
    <path d="M1240 1024 C 1340 900, 1440 800, 1536 740"/>
  </g>
</svg>

<main class="card">
  <img class="logo" src="logo.png" alt="Gomes Assessoria Jurídica">
  <h1>Acesso ao sistema</h1>
  <p class="sub">Entre com suas credenciais.</p>

  <form id="form" novalidate>
    <div class="campo">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
      <input id="email" type="email" autocomplete="username" placeholder="E-mail profissional" aria-label="E-mail profissional" required>
    </div>
    <div class="campo">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1" fill="currentColor"/></svg>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
      <button type="button" class="olho" id="olho" aria-label="Mostrar senha" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="linha">
      <label class="check"><input type="checkbox" id="manter"> Manter conectado</label>
      <button type="button" class="link" id="esqueci">Esqueceu a senha?</button>
    </div>

    <button type="submit" class="entrar" id="entrar">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
</main>

<script>
/*
  Tela de login — visual pronto.
  No protótipo atual NÃO há verificação de senha: quem controla o acesso é a conta do claude.ai.
  No sistema definitivo, trocar o bloco "PROTÓTIPO" pelo login real, por exemplo:
    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
*/
(function () {
  const $ = id => document.getElementById(id);
  const msg = (t, info) => { $('msg').textContent = t; $('msg').className = 'msg' + (info ? ' info' : ''); };
  const store = {
    set(k, v, longo) { try { (longo ? localStorage : sessionStorage).setItem(k, v); } catch (_) {} },
  };

  $('olho').addEventListener('click', () => {
    const s = $('senha'), mostrar = s.type === 'password';
    s.type = mostrar ? 'text' : 'password';
    $('olho').setAttribute('aria-pressed', String(mostrar));
    $('olho').setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
  });

  $('esqueci').addEventListener('click', () => msg('Peça ao administrador do escritório para redefinir sua senha.', true));

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const email = $('email').value.trim(), senha = $('senha').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg('Informe um e-mail válido.'); $('email').focus(); return; }
    if (!senha) { msg('Informe a senha.'); $('senha').focus(); return; }
    $('entrar').disabled = true; $('entrar').textContent = 'Entrando…'; msg('');

    /* PROTÓTIPO: só registra a sessão e abre o sistema. */
    store.set('gomes-sessao', email, $('manter').checked);
    setTimeout(() => { location.href = 'index.html'; }, 350);
  });
})();
</script>
</body>
</html>
